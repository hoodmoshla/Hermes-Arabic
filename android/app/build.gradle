apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def releaseSigningValues = [
    System.getenv('ANDROID_KEYSTORE_PATH'),
    System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    System.getenv('ANDROID_KEY_ALIAS'),
    System.getenv('ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigningValues.every { value -> value != null && !value.isEmpty() }

android {
    namespace = "com.hoodmoshla.hermesarabic"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.hoodmoshla.hermesarabic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.2.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
        python {
            version "3.11"
            buildPython (project.findProperty("hermesBuildPython") ?: System.getenv("PYTHON") ?: "python3")
            pip {
                install "-r", "src/main/python/requirements-hermes-android.txt"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

tasks.register("pruneHermesPythonAssets") {
    description = "Remove generated/cache-only Python files before Chaquopy packages Hermes."
    doLast {
        def pythonRoot = file("src/main/python")
        if (!pythonRoot.exists()) {
            return
        }

        def pycacheDirs = []
        pythonRoot.eachFileRecurse { f ->
            if (f.directory && f.name == "__pycache__") {
                pycacheDirs << f
            }
        }
        pycacheDirs.each { it.deleteDir() }

        // Android ships the runtime TUI bundle from assets/hermes-tui so
        // MainActivity can extract it next to the bundled Node executable.
        // The Python wheel fallback would duplicate the same entry.js in
        // Chaquopy's app.imy and is unused on Android.
        delete file("src/main/python/hermes_cli/tui_dist")
        // Desktop/workspace trees are not part of the Android runtime. Keep
        // them out even if a future sync copies them beside the engine.
        ["apps", "ui-tui", "web", "node_modules", "tests", "scripts", "docker", "evals"].each { name ->
            delete file("src/main/python/${name}")
        }
    }
}

preBuild.dependsOn("pruneHermesPythonAssets")

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "net.ladenthin:llama-android:5.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
